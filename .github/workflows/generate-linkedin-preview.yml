name: Build LinkedIn landscape preview
on:
  push:
    paths: ['.github/workflows/generate-linkedin-preview.yml']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome screenshot dependencies
        run: python -m pip install selenium Pillow
      - name: Capture 2x retina screenshot in LinkedIn 1.91:1 format
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import time
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--hide-scrollbars')
          options.add_argument('--force-color-profile=srgb')
          driver = webdriver.Chrome(options=options)
          try:
              # 1512x792 desktop composition, at 2x native resolution.
              driver.execute_cdp_cmd('Emulation.setDeviceMetricsOverride', {
                  'width':1512, 'height':792, 'deviceScaleFactor':2, 'mobile':False
              })
              driver.get('https://vaelds.github.io/NEXT_eud_eksamen_afs-tning_D/')
              driver.execute_async_script(
                  'const done=arguments[0]; document.fonts.ready.then(done);')
              driver.execute_script("""
                const css=document.createElement('style');
                css.textContent = `
                  html,body {scroll-behavior:auto!important;overflow:hidden!important}
                  ::-webkit-scrollbar {display:none!important}
                  .masthead {
                    height:106px!important;
                    min-height:106px!important;
                    padding-top:15px!important;
                    padding-bottom:15px!important;
                  }
                  .hero {
                    height:686px!important;
                    min-height:686px!important;
                    max-height:686px!important;
                    padding-top:47px!important;
                    padding-bottom:10px!important;
                  }
                  .hero-content {padding-bottom:80px!important}
                  .hero h1 {font-size:98px!important}
                  .hero-lead {
                    max-width:710px!important;
                    font-size:19px!important;
                    line-height:1.4!important;
                    margin-top:20px!important
                  }
                  .hero-actions {margin-top:22px!important}
                  .hero-shape-two {display:none!important}
                  .hero-stats {min-height:99px!important}
                  .hero-stats > div {padding:23px 20px!important}
                `;
                document.head.appendChild(css);
                window.scrollTo(0,0);
              """)
              time.sleep(3)
              rendered=Image.open(io.BytesIO(driver.get_screenshot_as_png()))
              print('Native screenshot',rendered.size,flush=True)
              # Save large, lossless pixels to withstand LinkedIn rescaling.
              out=rendered.convert('RGB').crop((0,0,3024,1584))
              target=Path('assets/images/linkedin-preview-2400x1256.png')
              target.parent.mkdir(parents=True,exist_ok=True)
              # 2400/1256 = 1.911, matching LinkedIn 1200/628.
              out=out.resize((2400,1256),Image.Resampling.LANCZOS)
              out.save(target,format='PNG',optimize=True)
              print('Created',target,'size',out.size,'bytes',target.stat().st_size)
          finally:
              driver.quit()
          PY
      - name: Commit optimized preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/linkedin-preview-2400x1256.png
          if ! git diff --cached --quiet; then
            git commit -m "Produce high-resolution 1.91:1 LinkedIn preview from actual webpage"
            git push
          fi
